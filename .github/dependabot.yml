# Dependabot version updates.
# Security updates are enabled separately in the repository settings and do not
# need an entry here, but they use the grouping and commit-message rules below.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # TypeScript 7 cannot be installed yet. Both typescript-eslint (8.70.0)
      # and ts-jest (29.4.12) declare a peer range that stops below 7, so the
      # install fails on a peer conflict. Remove this rule when both of them
      # support TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node must track the oldest Node release this package supports,
      # which is the "engines" field in package.json. A newer major would type
      # APIs that are not there on the oldest supported runtime, so the build
      # would stop catching a real problem. Raise both together, by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # One PR per group keeps the review load down and lets the lockfile
      # resolve a consistent set of transitive dependencies.
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
